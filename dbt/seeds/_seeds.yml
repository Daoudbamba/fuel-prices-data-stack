version: 2

seeds:
  - name: departements
    description: Départements français (geo.api.gouv.fr), avec le code de leur région.
    columns:
      - name: code_departement
        data_tests: [unique, not_null]
      - name: code_region
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('regions')
                field: code_region

  - name: regions
    description: Régions françaises (geo.api.gouv.fr).
    columns:
      - name: code_region
        data_tests: [unique, not_null]

  - name: carburants
    description: >
      Les six carburants du flux, avec des bornes de prix plausibles (en €/L) choisies
      pour détecter les erreurs d'unité, pas les prix élevés : tous les prix récents
      d'octobre-novembre 2026 sont dans ces bornes.
    columns:
      - name: id_carburant
        data_tests: [unique, not_null]

  - name: correspondance_enseignes
    description: >
      Regroupement des libellés de marque OpenStreetMap en enseignes. TotalEnergies
      Access, réseau à prix bas, reste distinct de TotalEnergies. Construit à partir
      de l'extraction du 18/11/2026 : 51 libellés couvrant 98,2 % des stations dotées
      d'une marque.
    columns:
      - name: marque_osm
        data_tests: [unique, not_null]
      - name: type_enseigne
        data_tests:
          - accepted_values:
              arguments:
                values: [grande_distribution, petrolier, independant]
