name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  # Connexion à la base PostgreSQL de test (service du job).
  ENTREPOT_HOST: localhost
  ENTREPOT_PORT: "5432"
  ENTREPOT_DB: entrepot
  ENTREPOT_USER: entrepot
  ENTREPOT_PASSWORD: ci-uniquement

jobs:
  python:
    name: Lint et tests Python
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: entrepot
          POSTGRES_USER: entrepot
          POSTGRES_PASSWORD: ci-uniquement
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U entrepot -d entrepot"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Dépendances
        run: pip install -r requirements/dev.txt
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (unitaires et intégration PostgreSQL)
        # Les tests de DAG sont ignorés ici (pas d'Airflow) : ils tournent dans le job « airflow ».
        run: pytest -ra

  dbt:
    name: dbt build sur une base de test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: entrepot
          POSTGRES_USER: entrepot
          POSTGRES_PASSWORD: ci-uniquement
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U entrepot -d entrepot"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: src
      # Chemin absolu : les étapes dbt s'exécutent depuis le dossier dbt/, où un chemin
      # relatif « dbt » désignerait dbt/dbt.
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Dépendances
        run: pip install -r requirements/dev.txt
      - name: Chargement de deux vrais jours réduits à 250 stations (code d'ingestion de production)
        run: python scripts/charger_donnees_ci.py
      - name: dbt deps et parse
        working-directory: dbt
        run: |
          dbt deps
          dbt parse
      - name: dbt build
        working-directory: dbt
        # L'extrait compte 250 stations par jour : le seuil de volume est abaissé.
        run: |
          dbt build --vars '{nb_stations_min_par_jour: 200}'
      - name: Une donnée cassée doit être arrêtée par le test métier
        # Un prix multiplié par 10 (virgule décalée) : le test prix_dans_les_bornes doit
        # échouer. S'il passe, la CI échoue. Les données sont ensuite rechargées.
        run: |
          python - <<'EOF'
          from fuel_prices.ingestion import connexion_depuis_environnement
          connexion = connexion_depuis_environnement()
          with connexion, connexion.cursor() as curseur:
              curseur.execute("""
                  update raw.prix set valeur = (valeur::numeric * 10)::text
                  where ctid = (select ctid from raw.prix
                                where date_fichier = (select max(date_fichier) from raw.prix)
                                  and carburant = 'Gazole'
                                  and maj::timestamp::date >= date_fichier - 1
                                limit 1)""")
              print("prix cassé :", curseur.rowcount, "ligne")
          EOF
          cd dbt
          if dbt test --select "test_name:prix_dans_les_bornes"; then
            echo "::error::La donnée cassée n'a pas été détectée par dbt."
            exit 1
          fi
          echo "Donnée cassée détectée par dbt, comme attendu."
          cd .. && python scripts/charger_donnees_ci.py
      - name: Documentation dbt
        working-directory: dbt
        run: dbt docs generate --static
      - name: Publication de la documentation et des résultats
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dbt-documentation
          path: |
            dbt/target/static_index.html
            dbt/target/run_results.json
          if-no-files-found: ignore

  airflow:
    name: DAG Airflow et Docker Compose
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Image Airflow du projet
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/airflow/Dockerfile
          tags: fuel-airflow:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Intégrité des DAG (import sans base Airflow)
        run: |
          docker run --rm --entrypoint bash \
            -e PYTHONPATH=/opt/airflow/src \
            -v "$PWD:/projet:ro" -w /projet fuel-airflow:ci \
            -c "pip install -q pytest==9.2.0 && python -m pytest -p no:cacheprovider -ra tests/test_dags.py"
      - name: Configuration Docker Compose valide
        run: |
          bash scripts/generer_env.sh
          docker compose config --quiet
